# Example only. Do NOT commit real credentials. Create the secret out of band, e.g.:
#
#   kubectl create secret generic dbsql-exporter-sp \
#     --namespace monitoring \
#     --from-literal=DATABRICKS_CLIENT_ID=<sp-application-id> \
#     --from-literal=DATABRICKS_CLIENT_SECRET=<sp-oauth-secret>
#
# The service principal needs CAN MONITOR on each watched SQL warehouse (see README).
apiVersion: v1
kind: Secret
metadata:
  name: dbsql-exporter-sp
  namespace: monitoring
type: Opaque
stringData:
  DATABRICKS_CLIENT_ID: "REPLACE_WITH_SP_APPLICATION_ID"
  DATABRICKS_CLIENT_SECRET: "REPLACE_WITH_SP_OAUTH_SECRET"
